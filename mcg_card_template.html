<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MCG Card</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080c;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;font-family:'Space Grotesk',sans-serif}
.cs{perspective:1100px;cursor:pointer}
.card{width:300px;height:470px;border-radius:12px;position:relative;transform-style:preserve-3d;transition:transform .06s ease-out}
.ci{width:100%;height:100%;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--vc-border);background:var(--vc-bg);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.7),0 0 40px var(--vc-glow);position:relative}
.band{height:3px;background:var(--vc-accent);flex-shrink:0}
.ch{padding:11px 13px 8px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cname{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-family:'Space Mono',monospace;font-size:8px;color:var(--vc-accent);letter-spacing:.5px;margin-top:3px;opacity:.8}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.vbadge{padding:2px 8px;border-radius:3px;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:1.5px;color:#000;text-transform:uppercase;background:var(--vc-accent);box-shadow:0 0 8px var(--vc-glow)}
.tbadge{padding:2px 6px;border-radius:2px;font-family:'Space Mono',monospace;font-size:7px;font-weight:700;letter-spacing:1px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.08)}
.ca{margin:0 11px;border-radius:9px;position:relative;overflow:hidden;flex-shrink:0;border:1px solid var(--vc-border);height:170px}
.ca::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.04;mix-blend-mode:overlay;pointer-events:none;z-index:2}
.ca::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,var(--fc-glow) 0%,transparent 65%);pointer-events:none;z-index:1}
.ca-logo{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center}
.ca-logo img{width:92px;height:92px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 18px var(--fc-color))}
.ca-fb{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;color:rgba(255,255,255,.08)}
.ca-bot{position:absolute;bottom:7px;left:8px;right:8px;z-index:4;display:flex;align-items:center;justify-content:space-between}
.ca-chain{display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(4px)}
.ca-dot{width:4px;height:4px;border-radius:50%}
.ca-lbl{font-family:'Space Mono',monospace;font-size:7px;color:rgba(255,255,255,.45);letter-spacing:1px;text-transform:uppercase}
.ca-rank{font-family:'Space Mono',monospace;font-size:8px;color:rgba(255,255,255,.3);padding:2px 7px;border-radius:3px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.05);backdrop-filter:blur(4px)}
.ctags{padding:6px 11px 4px;display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.tag{padding:2px 6px;border-radius:2px;font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.04);color:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.05)}
.tag.ct{color:var(--fc-color);opacity:.85}
.cdiv{height:1px;margin:0 11px;background:rgba(255,255,255,.04);flex-shrink:0}
.cstats{padding:8px 13px 6px;flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.srow{display:flex;align-items:center;gap:6px}
.slbl{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:1.5px;width:30px;flex-shrink:0;text-transform:uppercase}
.slbl.atk{color:#ff6b35}.slbl.def{color:#4d9de0}.slbl.spd{color:#11d3bc}.slbl.ctrl{color:#bb86fc}
.segs{display:flex;gap:2px;flex:1}
.seg{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.05)}
.seg.on.atk{background:#ff6b35;box-shadow:0 0 3px rgba(255,107,53,.5)}
.seg.on.def{background:#4d9de0;box-shadow:0 0 3px rgba(77,157,224,.5)}
.seg.on.spd{background:#11d3bc;box-shadow:0 0 3px rgba(17,211,188,.5)}
.seg.on.ctrl{background:#bb86fc;box-shadow:0 0 3px rgba(187,134,252,.5)}
.sval{font-family:'Space Mono',monospace;font-size:8px;width:20px;text-align:right;flex-shrink:0}
.sval.atk{color:rgba(255,107,53,.7)}.sval.def{color:rgba(77,157,224,.7)}.sval.spd{color:rgba(17,211,188,.7)}.sval.ctrl{color:rgba(187,134,252,.7)}
.cf{margin-top:auto;padding:6px 13px 10px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.04)}
.cf-id{font-family:'Space Mono',monospace;font-size:8px;color:var(--vc-accent);letter-spacing:.5px;opacity:.75}
.cf-pwr{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:rgba(255,255,255,.25)}
.cf-pwr span{color:var(--vc-accent);font-size:11px}

.vt-standard{--vc-accent:#6b7280;--vc-border:rgba(107,114,128,0.18);--vc-glow:rgba(107,114,128,0.07);--vc-bg:linear-gradient(168deg,#0d0d14 0%,#080810 100%)}
.vt-holo    {--vc-accent:#2afadf;--vc-border:rgba(42,250,223,0.3);--vc-glow:rgba(42,250,223,0.15);--vc-bg:linear-gradient(168deg,#041a18 0%,#020b0a 100%)}
.vt-full_art{--vc-accent:#a78bfa;--vc-border:rgba(167,139,250,0.32);--vc-glow:rgba(167,139,250,0.14);--vc-bg:linear-gradient(168deg,#110d26 0%,#07050f 100%)}
.vt-glitch  {--vc-accent:#ff6432;--vc-border:rgba(255,100,50,0.32);--vc-glow:rgba(255,100,50,0.14);--vc-bg:linear-gradient(168deg,#180800 0%,#0a0500 100%)}
.vt-gold    {--vc-accent:#ffc832;--vc-border:rgba(255,200,50,0.38);--vc-glow:rgba(255,200,50,0.18);--vc-bg:linear-gradient(168deg,#181000 0%,#0a0800 100%)}

.vt-holo .ci::after{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(125deg,transparent 20%,rgba(42,250,223,0.04) 35%,rgba(255,60,172,0.04) 50%,rgba(121,40,202,0.03) 65%,transparent 75%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;mix-blend-mode:screen}
.cs:hover .vt-holo .ci::after{opacity:1}
.vt-gold .ci::after{content:'';position:absolute;inset:0;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,215,0,0.07) 0%,transparent 55%);pointer-events:none;z-index:39}
.vt-gold .ci{animation:gold-breathe 3.5s ease-in-out infinite alternate}
@keyframes gold-breathe{from{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.7),0 0 35px rgba(255,200,50,.16)}to{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.7),0 0 60px rgba(255,200,50,.32),0 0 100px rgba(255,160,0,.14)}}
.vt-glitch .ci{animation:glitch-border 5s ease-in-out infinite}
.vt-glitch .ca{animation:glitch-art 6s ease-in-out infinite}
@keyframes glitch-border{0%,87%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.7),0 0 35px rgba(255,100,50,.12)}88%{box-shadow:3px 0 0 1px rgba(255,0,0,.35),0 18px 48px rgba(0,0,0,.7),-3px 0 rgba(0,255,200,.12)}89%{box-shadow:-2px 0 0 1px rgba(0,200,255,.25),0 18px 48px rgba(0,0,0,.7),2px 0 rgba(255,0,80,.12)}90%{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.7),0 0 35px rgba(255,100,50,.12)}}
@keyframes glitch-art{0%,88%,100%{transform:none;filter:none}89%{transform:translate(-2px,0);filter:hue-rotate(90deg) saturate(2)}90%{transform:translate(2px,0);filter:hue-rotate(-30deg)}91%{transform:none;filter:none}}
.vt-holo .band{background:linear-gradient(90deg,#2afadf,#7928ca,#ff3cac,#2afadf);background-size:200%;animation:band-slide 4s linear infinite}
.vt-gold .band{background:linear-gradient(90deg,#b8860b,#ffd700,#ffc000,#ffd700,#b8860b);background-size:200%;animation:band-slide 5s linear infinite}
.vt-glitch .band{background:linear-gradient(90deg,#ff6432,#ff3cac,#ff6432);background-size:200%;animation:band-slide 1.2s linear infinite;height:4px}
.vt-full_art .band{background:linear-gradient(90deg,#7928ca,#a78bfa,#7928ca);background-size:200%;animation:band-slide 5s linear infinite}
.vt-full_art .ca{height:210px}
@keyframes band-slide{to{background-position:200%}}
</style>
</head>
<body>
<div class="cs" id="scene">
<div class="card" id="card">
<div class="ci">
  <div class="band"></div>
  <div class="ch">
    <div style="min-width:0;flex:1">
      <div class="cname" id="cname">—</div>
      <div class="csub" id="csub">—</div>
    </div>
    <div class="badges">
      <div class="vbadge" id="vbadge">STD</div>
      <div class="tbadge" id="tbadge">TIER ?</div>
    </div>
  </div>
  <div class="ca" id="cart">
    <div class="ca-logo">
      <img id="cimg" src="" alt="" style="width:92px;height:92px;object-fit:contain;border-radius:50%">
      <div class="ca-fb" id="cfb" style="display:none"></div>
    </div>
    <div class="ca-bot">
      <div class="ca-chain"><div class="ca-dot" id="cdot"></div><span class="ca-lbl" id="clbl">—</span></div>
      <div class="ca-rank" id="crank"></div>
    </div>
  </div>
  <div class="ctags" id="ctags"></div>
  <div class="cdiv"></div>
  <div class="cstats" id="cstats"></div>
  <div class="cf">
    <div class="cf-id" id="cfid">—</div>
    <div class="cf-pwr">PWR <span id="cpwr">—</span></div>
  </div>
</div></div></div>

<script>
const FC={
  Solana:{color:'#14f195',glow:'rgba(20,241,149,0.28)',art:'radial-gradient(ellipse at 50% 65%,#042e1e 0%,#010b07 100%)'},
  Ethereum:{color:'#627eea',glow:'rgba(98,126,234,0.28)',art:'radial-gradient(ellipse at 50% 65%,#0e1540 0%,#050818 100%)'},
  Base:{color:'#0052ff',glow:'rgba(0,82,255,0.26)',art:'radial-gradient(ellipse at 50% 65%,#00083a 0%,#02040f 100%)'},
  BNB:{color:'#f3ba2f',glow:'rgba(243,186,47,0.24)',art:'radial-gradient(ellipse at 50% 65%,#1e1500 0%,#090700 100%)'},
  Dogecoin:{color:'#c2a633',glow:'rgba(194,166,51,0.28)',art:'radial-gradient(ellipse at 50% 65%,#1e1700 0%,#0a0900 100%)'},
  Other:{color:'#64748b',glow:'rgba(100,116,139,0.16)',art:'radial-gradient(ellipse at 50% 65%,#0d1218 0%,#060810 100%)'},
};
const VLABEL={standard:'STD',holo:'HOLO',full_art:'FULL ART',glitch:'GLITCH',gold:'GOLD'};
const TIER_COLOR={S:'#ff3cac',A:'#fbbf24',B:'#60a5fa',C:'#6b7280'};

function segs(val,cls){const n=Math.round((val||0)/10);return Array.from({length:10},(_,i)=>`<div class="seg${i<n?' on '+cls:''}"></div>`).join('')}

function render(c){
  const fc=FC[c.faction]||FC.Other;
  const vt=c.variantType||'standard';
  const sym=(c.symbol||'').toUpperCase();
  const card=document.getElementById('card');
  card.className=`card vt-${vt}`;
  card.style.setProperty('--fc-color',fc.color);
  card.style.setProperty('--fc-glow',fc.glow);
  document.getElementById('cname').textContent=c.name||'—';
  document.getElementById('csub').textContent=sym+(c.subtitle?' · '+c.subtitle:'');
  document.getElementById('vbadge').textContent=VLABEL[vt]||vt;
  document.getElementById('tbadge').textContent='TIER '+(c.projectTier||'?');
  document.getElementById('tbadge').style.color=TIER_COLOR[c.projectTier||'C']||'#6b7280';
  document.getElementById('cart').style.background=fc.art;
  const img=document.getElementById('cimg'),fb=document.getElementById('cfb');
  const src=c.imageB64||c.image||'';
  if(src){img.src=src;img.style.display='block';fb.style.display='none';img.style.filter=`drop-shadow(0 0 18px ${fc.color})`;img.onerror=()=>{img.style.display='none';fb.style.display='block';fb.textContent=sym.slice(0,4)}}
  else{img.style.display='none';fb.style.display='block';fb.textContent=sym.slice(0,4)}
  document.getElementById('cdot').style.cssText=`background:${fc.color};box-shadow:0 0 4px ${fc.color}`;
  document.getElementById('clbl').textContent=(c.faction||'?').toUpperCase();
  document.getElementById('crank').textContent=c.marketCapRank?'#'+c.marketCapRank:'';
  const tgs=[];
  if(c.faction&&c.faction!=='Other')tgs.push(`<span class="tag ct" style="color:${fc.color}">${c.faction}</span>`);
  if(c.subtitle)c.subtitle.split(' · ').forEach(p=>{if(p!==c.faction&&tgs.length<4)tgs.push(`<span class="tag">${p}</span>`)});
  document.getElementById('ctags').innerHTML=tgs.join('');
  document.getElementById('cstats').innerHTML=['atk','def','spd','ctrl'].map(k=>`<div class="srow"><div class="slbl ${k}">${k.toUpperCase()}</div><div class="segs">${segs(c[k.toUpperCase()]||0,k)}</div><div class="sval ${k}">${c[k.toUpperCase()]||0}</div></div>`).join('');
  document.getElementById('cfid').textContent=c.variantId||'';
  document.getElementById('cpwr').textContent=c.powerScore??'—';
}

const scene=document.getElementById('scene');
scene.addEventListener('mousemove',e=>{const r=scene.getBoundingClientRect();const dx=(e.clientX-r.left-r.width/2)/(r.width/2);const dy=(e.clientY-r.top-r.height/2)/(r.height/2);document.getElementById('card').style.transform=`rotateY(${dx*9}deg) rotateX(${-dy*9}deg)`});
scene.addEventListener('mouseleave',()=>{document.getElementById('card').style.transform=''});

(()=>{
  let c=window.CARD_DATA;
  if(!c){try{const p=new URLSearchParams(location.search);const raw=p.get('data');if(raw)c=JSON.parse(atob(raw))}catch(e){}}
  if(!c)c={name:'Pepe',symbol:'PEPE',image:'https://coin-images.coingecko.com/coins/images/29850/large/pepe-token.jpeg',faction:'Ethereum',variantType:'holo',projectTier:'S',marketCapRank:55,snapshotDate:'2026-03-07',subtitle:'Culture · ERC-20',ATK:87,DEF:80,SPD:48,CTRL:86,powerScore:77,variantId:'base_pepe_holo',variantRarity:'rare'};
  render(c);
})();
</script>
</body>
</html>
